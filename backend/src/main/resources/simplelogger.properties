# src/main/resources/simplelogger.properties
# 日志输出级别（warn/info/debug，warn仅输出警告，适合捕获编译警告）
org.apache.maven.cli.logging.SimpleLogger.defaultLogLevel=warn
# 输出编译器警告详情
org.apache.maven.cli.logging.SimpleLogger.showWarnings=true
org.apache.maven.cli.logging.SimpleLogger.showDeprecation=true
# 日志输出文件（指向你项目的target目录，和之前的报告目录统一）
org.apache.maven.cli.logging.SimpleLogger.logFile=${basedir}/target/code-quality-reports/compiler/compile-warnings.log
# 显示日志时间（可选）
org.apache.maven.cli.logging.SimpleLogger.showDateTime=true
org.apache.maven.cli.logging.SimpleLogger.dateTimeFormat=yyyy-MM-dd HH:mm:ss